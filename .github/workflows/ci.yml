name: CI

on:
  pull_request:
  push:
    branches: [main, feature-conflict]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f feature.txt
          test -f hello.txt
          test -f notes.txt

      - name: Check feature file content
        run: |
          grep -q "feature for issue #2" feature.txt

      - name: Check PR template
        run: |
          test -f .github/pull_request_template.md
          grep -q "Описание изменений" .github/pull_request_template.md

      - name: CI success
        run: echo "All CI checks passed!"
